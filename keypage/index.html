<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Unlocker - Your Key</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #fff;
        }
        .card {
            background: #161618;
            border: 1px solid #2d2d2d;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #10b981, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }
        .key-box {
            background: #1a1a1a;
            border: 2px solid #10b981;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        .key-label {
            color: #10b981;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .key-value {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #fff;
            user-select: all;
        }
        .copy-btn {
            margin-top: 20px;
            background: #10b981;
            color: #fff;
            border: none;
            padding: 12px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover { background: #059669; transform: scale(1.05); }
        .info { margin-top: 20px; color: #666; font-size: 13px; line-height: 1.6; }
        .timer { color: #f39c12; font-weight: 600; }
        .footer { margin-top: 25px; color: #444; font-size: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">MINECRAFT UNLOCKER</div>
        <div class="subtitle">by errortechh</div>
        <div class="key-box">
            <div class="key-label">Your Key</div>
            <div class="key-value" id="keyDisplay">Loading...</div>
        </div>
        <button class="copy-btn" onclick="copyKey()">Copy Key</button>
        <div class="info">
            Paste this key in the Minecraft Unlocker app.<br>
            Key expires in <span class="timer" id="timer">7 days</span>.
        </div>
        <div class="footer">errortechh &copy; 2026</div>
    </div>
    <script>
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
        const KEY_SECRET = "errortechh_mc_2026_";
        const KEY_LENGTH = 16;
        function getCurrentWeek() {
            return Math.floor(Date.now() / 1000 / (7 * 24 * 3600));
        }
        function getSecondsUntilNextWeek() {
            const week = getCurrentWeek();
            const nextWeekStart = (week + 1) * 7 * 24 * 3600;
            return nextWeekStart - Math.floor(Date.now() / 1000);
        }
        async function generateKey() {
            const week = getCurrentWeek();
            const hash = await sha256(KEY_SECRET + week);
            return hash.substring(0, KEY_LENGTH).toUpperCase();
        }
        function formatTime(seconds) {
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            if (days > 0) return days + "d " + hours + "h";
            return hours + "h";
        }
        async function init() {
            const key = await generateKey();
            document.getElementById('keyDisplay').textContent = key;
            function updateTimer() {
                const secs = getSecondsUntilNextWeek();
                document.getElementById('timer').textContent = formatTime(secs);
            }
            updateTimer();
            setInterval(updateTimer, 60000);
        }
        function copyKey() {
            const key = document.getElementById('keyDisplay').textContent;
            navigator.clipboard.writeText(key).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = 'Copied!';
                setTimeout(() => { btn.textContent = 'Copy Key'; }, 2000);
            });
        }
        init();
    </script>
</body>
</html>
